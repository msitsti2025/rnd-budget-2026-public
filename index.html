<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 정부 R&D 예산 현황</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg2: #232320;
      --bg3: #2c2c2a;
      --text: #f0efe9;
      --text2: #b4b2a9;
      --text3: #888780;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .page-header {
    max-width: 900px;
    margin: 0 auto 1.5rem;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 13px;
    color: var(--text3);
  }

  .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 10px;
  }
  @media (max-width: 600px) {
    .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  .stat {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
  .stat-val { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

  .panel {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 18px 20px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 0.03em;
    margin-bottom: 14px;
  }

  .two-col {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 14px;
  }
  @media (max-width: 640px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .bar-label {
    font-size: 12px;
    color: var(--text);
    width: 72px;
    flex-shrink: 0;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    height: 13px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-val {
    font-size: 11px;
    color: var(--text3);
    min-width: 40px;
    text-align: right;
    flex-shrink: 0;
  }

  .treemap-wrap {
    position: relative;
    width: 100%;
    height: 200px;
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .treemap-cell {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: default;
  }
  .treemap-name {
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    line-height: 1.3;
    padding: 2px 4px;
  }
  .treemap-amt {
    font-size: 10px;
    text-align: center;
    opacity: 0.85;
  }

  .policy-grid {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 6px 24px;
  }
  @media (max-width: 540px) {
    .policy-grid { grid-template-columns: 1fr; }
  }

  footer {
    max-width: 900px;
    margin: 1rem auto 0;
    font-size: 11px;
    color: var(--text3);
    text-align: center;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>2026년 정부 R&D 예산 현황</h1>
  <p>국가연구개발사업 세부사업 기준 · 과학기술혁신본부 · 단위: 백만원</p>
</div>

<div class="container">

  <div class="summary-grid">
    <div class="stat">
      <div class="stat-label">총 예산</div>
      <div class="stat-val">30.3조</div>
      <div class="stat-sub">백만원 기준</div>
    </div>
    <div class="stat">
      <div class="stat-label">세부사업 수</div>
      <div class="stat-val">1,238개</div>
      <div class="stat-sub">부처별 합산</div>
    </div>
    <div class="stat">
      <div class="stat-label">국가전략기술 투자</div>
      <div class="stat-val">9.4조</div>
      <div class="stat-sub">12개 분야</div>
    </div>
    <div class="stat">
      <div class="stat-label">참여 부처</div>
      <div class="stat-val">25개</div>
      <div class="stat-sub">10개 전문위원회</div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="section-label">부처별 예산</div>
      <div id="dept-bars"></div>
    </div>
    <div class="panel">
      <div class="section-label">전문위원회별 예산</div>
      <div id="com-bars"></div>
    </div>
  </div>

  <div class="panel">
    <div class="section-label">국가전략기술 12개 분야</div>
    <div class="treemap-wrap" id="treemap"></div>
  </div>

  <div class="panel">
    <div class="section-label">정책분야별 예산</div>
    <div class="policy-grid" id="policy-bars"></div>
  </div>

</div>

<footer>출처: 2026년 국가연구개발사업 세부·내역사업 현황 (과학기술혁신본부)</footer>

<script>
const TEAL   = '#1D9E75';
const PURPLE = '#534AB7';
const CORAL  = '#993C1D';
const AMBER  = '#BA7517';
const BLUE   = '#185FA5';
const GREEN  = '#3B6D11';
const PINK   = '#72243E';
const GRAY   = '#5F5E5A';

const depts = [
  {name:'과기정통부', val:11441},
  {name:'산업부',     val:5276},
  {name:'방사청',     val:3799},
  {name:'중기부',     val:2102},
  {name:'기후부',     val:1426},
  {name:'복지부',     val:1065},
  {name:'우주청',     val:925},
  {name:'해수부',     val:838},
  {name:'교육부',     val:622},
  {name:'농진청',     val:608},
  {name:'국토부',     val:573},
  {name:'기타',       val:1607},
];

const committees = [
  {name:'기계소재',       val:6757},
  {name:'기초기반',       val:5840},
  {name:'국방',           val:3866},
  {name:'생명의료',       val:2811},
  {name:'에너지원자력',   val:2696},
  {name:'인공지능ICT',    val:2259},
  {name:'우주항공국토',   val:1783},
  {name:'양자반도체',     val:1600},
  {name:'바이오농림수산', val:1410},
  {name:'공공해양환경',   val:1258},
];

const strats = [
  {name:'인공지능',      val:2432, bg:'#185FA5', fg:'#E6F1FB'},
  {name:'첨단바이오',    val:1621, bg:'#1D9E75', fg:'#E1F5EE'},
  {name:'우주·항공·해양',val:1410, bg:'#534AB7', fg:'#EEEDFE'},
  {name:'반도체/디스플레이', val:1168, bg:'#993C1D', fg:'#FAECE7'},
  {name:'첨단모빌리티',  val:612,  bg:'#BA7517', fg:'#FAEEDA'},
  {name:'첨단로봇·제조', val:483,  bg:'#0F6E56', fg:'#E1F5EE'},
  {name:'차세대통신',    val:352,  bg:'#3C3489', fg:'#EEEDFE'},
  {name:'수소',          val:301,  bg:'#712B13', fg:'#FAECE7'},
  {name:'양자',          val:301,  bg:'#3B6D11', fg:'#EAF3DE'},
  {name:'이차전지',      val:272,  bg:'#633806', fg:'#FAEEDA'},
  {name:'사이버보안',    val:252,  bg:'#72243E', fg:'#FBEAF0'},
  {name:'차세대원자력',  val:233,  bg:'#444441', fg:'#F1EFE8'},
];

const policies = [
  {name:'출연·직할',  val:4014, color:PURPLE},
  {name:'국방',       val:3866, color:CORAL},
  {name:'기술사업화', val:3376, color:TEAL},
  {name:'기초연구',   val:3359, color:BLUE},
  {name:'탄소중립',   val:2677, color:AMBER},
  {name:'재난안전',   val:2426, color:GREEN},
  {name:'인력양성',   val:1333, color:PINK},
  {name:'지역',       val:1199, color:GRAY},
];

function makeBars(containerId, data, color) {
  const el = document.getElementById(containerId);
  const max = data[0].val;
  el.innerHTML = data.map(d => {
    const pct = Math.round(d.val / max * 100);
    const display = (d.val / 1000).toFixed(1) + '조';
    return `<div class="bar-row">
      <span class="bar-label">${d.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      <span class="bar-val">${display}</span>
    </div>`;
  }).join('');
}

function makePolicyBars(data) {
  const el = document.getElementById('policy-bars');
  const max = data[0].val;
  el.innerHTML = data.map(d => {
    const pct = Math.round(d.val / max * 100);
    const display = (d.val / 1000).toFixed(1) + '조';
    return `<div class="bar-row" style="margin-bottom:6px;">
      <span class="bar-label">${d.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${d.color};"></div></div>
      <span class="bar-val">${display}</span>
    </div>`;
  }).join('');
}

function drawTreemap() {
  const container = document.getElementById('treemap');
  const W = container.offsetWidth || 860;
  const H = 200;
  const total = strats.reduce((s, d) => s + d.val, 0);

  function squarify(items, x, y, w, h) {
    if (!items.length) return [];
    const cells = [];
    let remaining = [...items];
    let cx = x, cy = y, cw = w, ch = h;
    while (remaining.length) {
      const isHoriz = cw >= ch;
      const dim = isHoriz ? ch : cw;
      let batch = [], batchSum = 0, bestRatio = Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const newBatch = [...batch, remaining[i]];
        const newSum = batchSum + remaining[i].val;
        const area = (newSum / total) * (w * h);
        const batchDim = area / dim;
        let maxR = 0;
        newBatch.forEach(it => {
          const a = (it.val / total) * (w * h);
          const bw = a / batchDim;
          const r = Math.max(batchDim / bw, bw / batchDim);
          if (r > maxR) maxR = r;
        });
        if (maxR <= bestRatio || batch.length === 0) {
          batch = newBatch; batchSum = newSum; bestRatio = maxR;
        } else break;
      }
      remaining = remaining.slice(batch.length);
      const batchArea = (batchSum / total) * (w * h);
      const batchDim = batchArea / dim;
      let offset = 0;
      batch.forEach(it => {
        const itArea = (it.val / total) * (w * h);
        const itDim = itArea / batchDim;
        if (isHoriz) cells.push({item:it, x:cx, y:cy+offset, w:batchDim, h:itDim});
        else         cells.push({item:it, x:cx+offset, y:cy, w:itDim, h:batchDim});
        offset += itDim;
      });
      if (isHoriz) { cx += batchDim; cw -= batchDim; }
      else         { cy += batchDim; ch -= batchDim; }
    }
    return cells;
  }

  const cells = squarify([...strats].sort((a,b)=>b.val-a.val), 0, 0, W, H);
  cells.forEach(c => {
    const div = document.createElement('div');
    div.className = 'treemap-cell';
    div.style.cssText = `left:${c.x+1}px;top:${c.y+1}px;width:${c.w-2}px;height:${c.h-2}px;background:${c.item.bg};`;
    const pct = (c.item.val / total * 100).toFixed(1);
    const amt = (c.item.val / 1000).toFixed(1) + '조';
    if (c.w > 55 && c.h > 32) {
      div.innerHTML = `<span class="treemap-name" style="color:${c.item.fg};">${c.item.name}</span>
        <span class="treemap-amt" style="color:${c.item.fg};">${amt} · ${pct}%</span>`;
    } else if (c.w > 30 && c.h > 20) {
      div.innerHTML = `<span class="treemap-name" style="color:${c.item.fg};font-size:9px;">${c.item.name}</span>`;
    }
    container.appendChild(div);
  });
}

makeBars('dept-bars', depts, TEAL);
makeBars('com-bars', committees, PURPLE);
makePolicyBars(policies);
drawTreemap();

window.addEventListener('resize', () => {
  const t = document.getElementById('treemap');
  t.innerHTML = '';
  drawTreemap();
});
</script>
</body>
</html>
